[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open_neuron"
version = "0.1.0"
description = "An educational NumPy implementation of fully connected neural networks"
readme = "README.md"
dependencies = ["numpy"]

[project.optional-dependencies]
tensorflow = ["tensorflow-cpu>=2.21,<2.22"]

[tool.setuptools.packages.find]
where = ["src"]
